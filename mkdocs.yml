site_name: IT
site_url: https://it.akadian.ca/
site_description: Courses on the systems of modern IT, by category, starting with SQL from beginner to expert; every example run on a real database
repo_url: https://github.com/TTMathCS/it
edit_uri: edit/main/docs/
copyright: 'Part of <a href="https://www.akadian.ca/">Mars – your new home</a>'
# notes for the repo, not pages
exclude_docs: |
  README.md
use_directory_urls: false
# a page with robots: noindex in its front matter is also left out of sitemap.xml (tools/hooks.py)
hooks:
  - tools/hooks.py

theme:
  name: material
  custom_dir: overrides
  favicon: assets/akadian-icon.png   # the Akadian A, as on akadian.ca
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: Light colours
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark colours
  font: false

extra_css:
  - fonts/fonts.css
  - stylesheets/mars.css
  - stylesheets/books.css
  - stylesheets/reader.css
  - stylesheets/it.css
  - stylesheets/sql-play.css

extra:
  homepage: https://www.akadian.ca/

extra_javascript:
  - https://www.akadian.ca/home-music.js?site   # the song from www.akadian.ca: it goes on here while it plays (Mars-Home home-music.js)
  - https://www.akadian.ca/schools.js   # the Mars Schools row: links to every other school site; its one list is the Mars Schools section of Mars-Requirements site/menu.md (Mars-Home schools.js, written by Mars-Build tools/menu.py)
  - javascripts/mars-link.js
  - javascripts/home-link.js
  - javascripts/levels.js
  - javascripts/reader.js
  - javascripts/sql-play.js   # the SQL playground: PGlite (PostgreSQL in WebAssembly, Apache-2.0), self-hosted in assets/pglite/
  - javascripts/py-play.js   # the Python run boxes on the Python practice tasks only: Pyodide 314.0.7 (MPL-2.0), self-hosted in assets/pyodide/

markdown_extensions:
  - toc:
      permalink: true
      title: On this page
  - tables
  - admonition
  - pymdownx.details
  - md_in_html
  - attr_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

# With --strict, a broken link or #anchor stops the build
# the Tech by Math 2025 drafts have many sub-pages (use cases, proofs); they are reached by links, not the menu
not_in_nav: |
  /tech-by-math/
  /notes/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

