<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="640" viewBox="0 0 980 640">
  <defs>
    <style>
      .title{font:700 20px Arial, sans-serif;fill:#222}
      .box{fill:#f6f8fa;stroke:#9aa7b0}
      .accent{fill:#e6f4ff;stroke:#4a90e2}
      .green{fill:#eef7ee;stroke:#4caf50}
      .label{font:600 13px Arial, sans-serif;fill:#222}
      .text{font:12px Arial, sans-serif;fill:#333}
      .arrow{stroke:#6b6f76;stroke-width:1.6;marker-end:url(#m)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6f76" />
    </marker>
  </defs>

  <text x="20" y="30" class="title">AI Agent Architecture: Subsystems and Control Loop</text>

  <!-- Control Loop -->
  <rect x="20" y="60" width="600" height="180" rx="8" class="accent"/>
  <text x="35" y="83" class="label">Control Loop</text>
  <text x="35" y="103" class="text">1) Perceive input → 2) Plan steps → 3) Act via tools → 4) Reflect &amp; update state</text>
  <text x="35" y="123" class="text">Failure handling: retries, backoff, tool fallbacks, timeouts, budget checks</text>
  <text x="35" y="143" class="text">Evaluation: self‑critique, tests, human approvals at gates</text>

  <!-- Memory -->
  <rect x="20" y="260" width="280" height="140" rx="8" class="box"/>
  <text x="35" y="283" class="label">Memory</text>
  <text x="35" y="303" class="text">• Working memory (context window)</text>
  <text x="35" y="320" class="text">• Long‑term vector store (RAG)</text>
  <text x="35" y="337" class="text">• Episodic/task history</text>

  <!-- Tools -->
  <rect x="320" y="260" width="300" height="140" rx="8" class="green"/>
  <text x="335" y="283" class="label">Tool Interface</text>
  <text x="335" y="303" class="text">• API calls, DB queries, search</text>
  <text x="335" y="320" class="text">• Code exec sandbox</text>
  <text x="335" y="337" class="text">• Browsers, apps, devices</text>

  <!-- Governance -->
  <rect x="640" y="60" width="320" height="340" rx="8" class="box"/>
  <text x="655" y="83" class="label">Governance</text>
  <text x="655" y="103" class="text">• Permissions &amp; scopes</text>
  <text x="655" y="120" class="text">• Guardrails &amp; refusals</text>
  <text x="655" y="137" class="text">• Safety filters</text>
  <text x="655" y="154" class="text">• PII redaction</text>
  <text x="655" y="171" class="text">• Audit trails</text>
  <text x="655" y="188" class="text">• Policy packs</text>

  <!-- Observability -->
  <rect x="20" y="420" width="940" height="90" rx="8" class="box"/>
  <text x="35" y="443" class="label">Observability</text>
  <text x="35" y="463" class="text">• Tracing, logs, costs, latency, tool success rates, evaluation results</text>

  <!-- External world -->
  <rect x="20" y="520" width="940" height="90" rx="8" class="box"/>
  <text x="35" y="543" class="label">External World</text>
  <text x="35" y="563" class="text">Users, systems, data sources, networks, devices</text>

  <!-- Arrows -->
  <line x1="620" y1="150" x2="640" y2="150" class="arrow"/>
  <line x1="470" y1="330" x2="470" y2="240" class="arrow"/>
  <line x1="180" y1="330" x2="180" y2="240" class="arrow"/>
  <line x1="180" y1="400" x2="180" y2="420" class="arrow"/>
  <line x1="470" y1="400" x2="470" y2="420" class="arrow"/>
  <line x1="800" y1="400" x2="800" y2="420" class="arrow"/>
  <line x1="490" y1="510" x2="490" y2="520" class="arrow"/>
</svg>