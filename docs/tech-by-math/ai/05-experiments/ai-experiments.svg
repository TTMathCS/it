<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trainingGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1976d2;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="validationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff5722;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#d84315;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="foldGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:0.6" />
    </linearGradient>
    <radialGradient id="optimumGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffc107;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff8f00;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">AI Experiments &amp; Validation</text>
  
  <!-- Learning Curves Section -->
  <g id="learning-curves">
    <rect x="30" y="60" width="360" height="250" fill="#ffffff" stroke="#1976d2" stroke-width="2" rx="10"/>
    <text x="210" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1976d2">Learning Curves</text>
    
    <!-- Chart axes -->
    <g id="learning-chart">
      <!-- Axes -->
      <line x1="70" y1="110" x2="70" y2="270" stroke="#333" stroke-width="2"/>
      <line x1="70" y1="270" x2="350" y2="270" stroke="#333" stroke-width="2"/>
      
      <!-- Y-axis labels (Loss) -->
      <text x="60" y="115" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">2.5</text>
      <text x="60" y="145" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">2.0</text>
      <text x="60" y="175" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">1.5</text>
      <text x="60" y="205" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">1.0</text>
      <text x="60" y="235" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">0.5</text>
      <text x="60" y="275" text-anchor="end" font-family="Arial, sans-serif" font-size="10" fill="#666">0.0</text>
      
      <!-- X-axis labels (Epochs) -->
      <text x="100" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">0</text>
      <text x="160" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">50</text>
      <text x="220" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">100</text>
      <text x="280" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">150</text>
      <text x="340" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">200</text>
      
      <!-- Axis labels -->
      <text x="210" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Epochs</text>
      <text x="25" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333" transform="rotate(-90 25 190)">Loss</text>
      
      <!-- Training Loss Curve -->
      <path d="M 100 120 Q 130 140, 160 165 Q 190 185, 220 205 Q 250 220, 280 230 Q 310 235, 340 240" 
            stroke="#1976d2" stroke-width="3" fill="none"/>
      
      <!-- Validation Loss Curve -->
      <path d="M 100 125 Q 130 150, 160 175 Q 190 195, 220 210 Q 250 215, 280 220 Q 310 225, 340 235" 
            stroke="#ff5722" stroke-width="3" fill="none"/>
      
      <!-- Legend -->
      <rect x="250" y="120" width="80" height="40" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="3"/>
      <line x1="260" y1="135" x2="280" y2="135" stroke="#1976d2" stroke-width="3"/>
      <text x="285" y="138" font-family="Arial, sans-serif" font-size="10" fill="#1976d2">Training</text>
      <line x1="260" y1="150" x2="280" y2="150" stroke="#ff5722" stroke-width="3"/>
      <text x="285" y="153" font-family="Arial, sans-serif" font-size="10" fill="#ff5722">Validation</text>
    </g>
  </g>
  
  <!-- Cross-Validation Section -->
  <g id="cross-validation">
    <rect x="410" y="60" width="360" height="250" fill="#ffffff" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="590" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4caf50">K-Fold Cross-Validation</text>
    
    <!-- K-Fold visualization -->
    <g id="kfold">
      <text x="590" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">5-Fold Cross-Validation</text>
      
      <!-- Fold 1 -->
      <g id="fold-1">
        <text x="440" y="135" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 1:</text>
        <rect x="480" y="125" width="40" height="15" fill="#ffcdd2" stroke="#f44336" stroke-width="1"/>
        <rect x="520" y="125" width="160" height="15" fill="url(#foldGradient)" stroke="#4caf50" stroke-width="1"/>
        <text x="690" y="137" font-family="Arial, sans-serif" font-size="10" fill="#333">Val</text>
        <text x="720" y="137" font-family="Arial, sans-serif" font-size="10" fill="#333">Train</text>
      </g>
      
      <!-- Fold 2 -->
      <g id="fold-2">
        <text x="440" y="155" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 2:</text>
        <rect x="480" y="145" width="40" height="15" fill="url(#foldGradient)" stroke="#4caf50" stroke-width="1"/>
        <rect x="520" y="145" width="40" height="15" fill="#ffcdd2" stroke="#f44336" stroke-width="1"/>
        <rect x="560" y="145" width="120" height="15" fill="url(#foldGradient)" stroke="#4caf50" stroke-width="1"/>
      </g>
      
      <!-- Fold 3 -->
      <g id="fold-3">
        <text x="440" y="175" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 3:</text>
        <rect x="480" y="165" width="80" height="15" fill="url(#foldGradient)" stroke="#4caf50" stroke-width="1"/>
        <rect x="560" y="165" width="40" height="15" fill="#ffcdd2" stroke="#f44336" stroke-width="1"/>
        <rect x="600" y="165" width="80" height="15" fill="url(#foldGradient)" stroke="#4caf50" stroke-width="1"/>
      </g>
      
      <!-- Fold 4 -->
      <g id="fold-4">
        <text x="440" y="195" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 4:</text>
        <rect x="480" y="185" width="120" height="15" fill="url(#foldGradient)" stroke="#4caf50" stroke-width="1"/>
        <rect x="600" y="185" width="40" height="15" fill="#ffcdd2" stroke="#f44336" stroke-width="1"/>
        <rect x="640" y="185" width="40" height="15" fill="url(#foldGradient)" stroke="#4caf50" stroke-width="1"/>
      </g>
      
      <!-- Fold 5 -->
      <g id="fold-5">
        <text x="440" y="215" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Fold 5:</text>
        <rect x="480" y="205" width="160" height="15" fill="url(#foldGradient)" stroke="#4caf50" stroke-width="1"/>
        <rect x="640" y="205" width="40" height="15" fill="#ffcdd2" stroke="#f44336" stroke-width="1"/>
      </g>
      
      <!-- Results -->
      <text x="430" y="245" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Cross-Validation Score:</text>
      <text x="430" y="260" font-family="Arial, sans-serif" font-size="10" fill="#555">CV Score = (1/k) Σᵢ Scoreᵢ</text>
      <text x="430" y="275" font-family="Arial, sans-serif" font-size="10" fill="#555">Example: (0.92 + 0.89 + 0.91 + 0.88 + 0.90) / 5 = 0.90</text>
      <text x="430" y="290" font-family="Arial, sans-serif" font-size="10" fill="#555">Standard Error: σ/√k = 0.015/√5 = 0.007</text>
    </g>
  </g>
  
  <!-- Hyperparameter Optimization Section -->
  <g id="hyperparameter-optimization">
    <rect x="30" y="330" width="360" height="240" fill="#ffffff" stroke="#ff9800" stroke-width="2" rx="10"/>
    <text x="210" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff9800">Hyperparameter Optimization</text>
    
    <!-- 3D Surface representing hyperparameter space -->
    <g id="hyperparam-surface">
      <!-- Grid Search Points -->
      <text x="50" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Grid Search</text>
      
      <!-- Grid points -->
      <g fill="#666" opacity="0.7">
        <circle cx="80" cy="400" r="3"/>
        <circle cx="120" cy="400" r="3"/>
        <circle cx="160" cy="400" r="3"/>
        <circle cx="200" cy="400" r="3"/>
        <circle cx="80" cy="430" r="3"/>
        <circle cx="120" cy="430" r="3"/>
        <circle cx="160" cy="430" r="3"/>
        <circle cx="200" cy="430" r="3"/>
        <circle cx="80" cy="460" r="3"/>
        <circle cx="120" cy="460" r="3"/>
        <circle cx="160" cy="460" r="3"/>
        <circle cx="200" cy="460" r="3"/>
        <circle cx="80" cy="490" r="3"/>
        <circle cx="120" cy="490" r="3"/>
        <circle cx="160" cy="490" r="3"/>
        <circle cx="200" cy="490" r="3"/>
      </g>
      
      <!-- Best point from grid search -->
      <circle cx="160" cy="430" r="8" fill="url(#optimumGradient)" stroke="#f57c00" stroke-width="2"/>
      
      <!-- Random Search Points -->
      <text x="250" y="380" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Random Search</text>
      
      <!-- Random points -->
      <g fill="#9c27b0" opacity="0.7">
        <circle cx="285" cy="395" r="3"/>
        <circle cx="315" cy="410" r="3"/>
        <circle cx="295" cy="425" r="3"/>
        <circle cx="335" cy="415" r="3"/>
        <circle cx="305" cy="445" r="3"/>
        <circle cx="325" cy="435" r="3"/>
        <circle cx="275" cy="450" r="3"/>
        <circle cx="345" cy="460" r="3"/>
        <circle cx="290" cy="470" r="3"/>
        <circle cx="320" cy="485" r="3"/>
        <circle cx="310" cy="495" r="3"/>
        <circle cx="340" cy="475" r="3"/>
      </g>
      
      <!-- Best point from random search -->
      <circle cx="305" cy="445" r="8" fill="url(#optimumGradient)" stroke="#7b1fa2" stroke-width="2"/>
      
      <!-- Axes labels -->
      <text x="140" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Learning Rate (α)</text>
      <text x="25" y="450" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333" transform="rotate(-90 25 450)">Batch Size</text>
    </g>
    
    <!-- Optimization methods -->
    <text x="50" y="535" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Optimization Methods:</text>
    <text x="50" y="550" font-family="Arial, sans-serif" font-size="10" fill="#555">• Grid Search: Exhaustive search over parameter grid</text>
    <text x="50" y="565" font-family="Arial, sans-serif" font-size="10" fill="#555">• Random Search: Random sampling from parameter space</text>
  </g>
  
  <!-- Experimental Design Section -->
  <g id="experimental-design">
    <rect x="410" y="330" width="360" height="240" fill="#ffffff" stroke="#9c27b0" stroke-width="2" rx="10"/>
    <text x="590" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9c27b0">Experimental Design</text>
    
    <!-- A/B Testing visualization -->
    <g id="ab-testing">
      <text x="590" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">A/B Testing Framework</text>
      
      <!-- Control Group -->
      <rect x="450" y="400" width="100" height="60" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
      <text x="500" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50">Control (A)</text>
      <text x="500" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Model v1.0</text>
      <text x="500" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Accuracy: 0.85</text>
      <text x="500" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">n = 1000</text>
      
      <!-- Treatment Group -->
      <rect x="580" y="400" width="100" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
      <text x="630" y="415" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">Treatment (B)</text>
      <text x="630" y="430" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Model v2.0</text>
      <text x="630" y="445" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Accuracy: 0.88</text>
      <text x="630" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#666">n = 1000</text>
      
      <!-- Statistical Test -->
      <rect x="490" y="480" width="140" height="50" fill="#f3e5f5" stroke="#9c27b0" stroke-width="1" rx="5"/>
      <text x="560" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#9c27b0">Statistical Test</text>
      <text x="560" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">t = (μ_B - μ_A) / SE</text>
      <text x="560" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">p-value &lt; 0.05 ✓</text>
    </g>
    
    <!-- Statistical significance -->
    <text x="430" y="550" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Statistical Measures:</text>
    <text x="430" y="565" font-family="Arial, sans-serif" font-size="10" fill="#555">• Effect Size: Cohen's d = (μ₁ - μ₂) / σ_pooled</text>
  </g>
  
  <!-- Performance Metrics -->
  <g id="performance-metrics">
    <rect x="220" y="50" width="360" height="30" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="5"/>
    <text x="230" y="68" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Key Metrics: Accuracy, Precision, Recall, F1-Score, AUC-ROC</text>
  </g>
</svg>