<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="neuronGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4fc3f7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#29b6f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="layerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#81c784;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#66bb6a;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">AI Core Mathematical Models</text>
  
  <!-- Neural Network Layers -->
  <g id="neural-network">
    <!-- Input Layer -->
    <rect x="50" y="80" width="120" height="400" fill="url(#layerGradient)" stroke="#4caf50" stroke-width="2"/>
    <text x="110" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Input Layer</text>
    <text x="110" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">x₁, x₂, ..., xₙ</text>
    
    <!-- Input Neurons -->
    <circle cx="110" cy="120" r="15" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2"/>
    <circle cx="110" cy="180" r="15" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2"/>
    <circle cx="110" cy="240" r="15" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2"/>
    <circle cx="110" cy="300" r="15" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2"/>
    <circle cx="110" cy="360" r="15" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2"/>
    <circle cx="110" cy="420" r="15" fill="url(#neuronGradient)" stroke="#1976d2" stroke-width="2"/>
    
    <!-- Hidden Layer 1 -->
    <rect x="250" y="80" width="120" height="400" fill="url(#layerGradient)" stroke="#ff9800" stroke-width="2"/>
    <text x="310" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Hidden Layer 1</text>
    <text x="310" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">h₁⁽¹⁾, h₂⁽¹⁾, ..., h_m⁽¹⁾</text>
    
    <!-- Hidden Neurons 1 -->
    <circle cx="310" cy="110" r="15" fill="url(#neuronGradient)" stroke="#f57c00" stroke-width="2"/>
    <circle cx="310" cy="160" r="15" fill="url(#neuronGradient)" stroke="#f57c00" stroke-width="2"/>
    <circle cx="310" cy="210" r="15" fill="url(#neuronGradient)" stroke="#f57c00" stroke-width="2"/>
    <circle cx="310" cy="260" r="15" fill="url(#neuronGradient)" stroke="#f57c00" stroke-width="2"/>
    <circle cx="310" cy="310" r="15" fill="url(#neuronGradient)" stroke="#f57c00" stroke-width="2"/>
    <circle cx="310" cy="360" r="15" fill="url(#neuronGradient)" stroke="#f57c00" stroke-width="2"/>
    <circle cx="310" cy="410" r="15" fill="url(#neuronGradient)" stroke="#f57c00" stroke-width="2"/>
    
    <!-- Hidden Layer 2 -->
    <rect x="450" y="80" width="120" height="400" fill="url(#layerGradient)" stroke="#e91e63" stroke-width="2"/>
    <text x="510" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Hidden Layer 2</text>
    <text x="510" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">h₁⁽²⁾, h₂⁽²⁾, ..., h_k⁽²⁾</text>
    
    <!-- Hidden Neurons 2 -->
    <circle cx="510" cy="130" r="15" fill="url(#neuronGradient)" stroke="#c2185b" stroke-width="2"/>
    <circle cx="510" cy="190" r="15" fill="url(#neuronGradient)" stroke="#c2185b" stroke-width="2"/>
    <circle cx="510" cy="250" r="15" fill="url(#neuronGradient)" stroke="#c2185b" stroke-width="2"/>
    <circle cx="510" cy="310" r="15" fill="url(#neuronGradient)" stroke="#c2185b" stroke-width="2"/>
    <circle cx="510" cy="370" r="15" fill="url(#neuronGradient)" stroke="#c2185b" stroke-width="2"/>
    
    <!-- Output Layer -->
    <rect x="650" y="80" width="120" height="400" fill="url(#layerGradient)" stroke="#9c27b0" stroke-width="2"/>
    <text x="710" y="70" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Output Layer</text>
    <text x="710" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#555">ŷ₁, ŷ₂, ..., ŷ_p</text>
    
    <!-- Output Neurons -->
    <circle cx="710" cy="200" r="15" fill="url(#neuronGradient)" stroke="#7b1fa2" stroke-width="2"/>
    <circle cx="710" cy="280" r="15" fill="url(#neuronGradient)" stroke="#7b1fa2" stroke-width="2"/>
    <circle cx="710" cy="360" r="15" fill="url(#neuronGradient)" stroke="#7b1fa2" stroke-width="2"/>
    
    <!-- Connection lines (sample) -->
    <line x1="125" y1="120" x2="295" y2="110" stroke="#666" stroke-width="1" opacity="0.6"/>
    <line x1="125" y1="180" x2="295" y2="160" stroke="#666" stroke-width="1" opacity="0.6"/>
    <line x1="125" y1="240" x2="295" y2="210" stroke="#666" stroke-width="1" opacity="0.6"/>
    <line x1="325" y1="160" x2="495" y2="130" stroke="#666" stroke-width="1" opacity="0.6"/>
    <line x1="325" y1="210" x2="495" y2="190" stroke="#666" stroke-width="1" opacity="0.6"/>
    <line x1="525" y1="190" x2="695" y2="200" stroke="#666" stroke-width="1" opacity="0.6"/>
    <line x1="525" y1="250" x2="695" y2="280" stroke="#666" stroke-width="1" opacity="0.6"/>
  </g>
  
  <!-- Mathematical Equations -->
  <g id="equations">
    <!-- Forward Propagation -->
    <rect x="50" y="520" width="700" height="70" fill="#ffffff" stroke="#ddd" stroke-width="1" rx="5"/>
    <text x="60" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Forward Propagation:</text>
    <text x="60" y="560" font-family="Arial, sans-serif" font-size="12" fill="#333">z⁽ˡ⁾ = W⁽ˡ⁾a⁽ˡ⁻¹⁾ + b⁽ˡ⁾</text>
    <text x="60" y="575" font-family="Arial, sans-serif" font-size="12" fill="#333">a⁽ˡ⁾ = σ(z⁽ˡ⁾)</text>
    
    <text x="400" y="540" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2c3e50">Backpropagation:</text>
    <text x="400" y="560" font-family="Arial, sans-serif" font-size="12" fill="#333">∂L/∂W⁽ˡ⁾ = δ⁽ˡ⁾(a⁽ˡ⁻¹⁾)ᵀ</text>
    <text x="400" y="575" font-family="Arial, sans-serif" font-size="12" fill="#333">δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾)ᵀδ⁽ˡ⁺¹⁾ ⊙ σ'(z⁽ˡ⁾)</text>
  </g>
  
  <!-- Activation Functions -->
  <g id="activation-functions" transform="translate(50, 50)">
    <!-- Sigmoid -->
    <circle cx="150" cy="50" r="25" fill="#fff3e0" stroke="#ff9800" stroke-width="2"/>
    <text x="150" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#e65100">σ(x)</text>
    <text x="150" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#e65100">1/(1+e⁻ˣ)</text>
    
    <!-- ReLU -->
    <circle cx="250" cy="50" r="25" fill="#e8f5e8" stroke="#4caf50" stroke-width="2"/>
    <text x="250" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#2e7d32">ReLU</text>
    <text x="250" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#2e7d32">max(0,x)</text>
    
    <!-- Tanh -->
    <circle cx="350" cy="50" r="25" fill="#f3e5f5" stroke="#9c27b0" stroke-width="2"/>
    <text x="350" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#7b1fa2">tanh</text>
    <text x="350" y="57" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#7b1fa2">(eˣ-e⁻ˣ)/(eˣ+e⁻ˣ)</text>
  </g>
  
  <!-- Loss Function -->
  <g id="loss-function">
    <text x="600" y="560" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#d32f2f">Loss Function:</text>
    <text x="600" y="575" font-family="Arial, sans-serif" font-size="12" fill="#d32f2f">L = -∑ yᵢlog(ŷᵢ)</text>
  </g>
</svg>