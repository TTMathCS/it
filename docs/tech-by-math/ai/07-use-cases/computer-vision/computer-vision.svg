<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="imageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="convGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="featureGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="detectionGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Computer Vision: Mathematical Foundations</text>
  
  <!-- Input Image Section -->
  <g id="input-image">
    <rect x="30" y="60" width="120" height="100" fill="url(#imageGradient)" stroke="#1976d2" stroke-width="2" rx="8"/>
    <text x="90" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Input Image</text>
    <text x="90" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">H×W×C</text>
    <text x="90" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">RGB Pixels</text>
    
    <!-- Pixel grid representation -->
    <g fill="#1976d2" opacity="0.7">
      <rect x="50" y="130" width="8" height="8"/>
      <rect x="60" y="130" width="8" height="8"/>
      <rect x="70" y="130" width="8" height="8"/>
      <rect x="80" y="130" width="8" height="8"/>
      <rect x="50" y="140" width="8" height="8"/>
      <rect x="60" y="140" width="8" height="8"/>
      <rect x="70" y="140" width="8" height="8"/>
      <rect x="80" y="140" width="8" height="8"/>
    </g>
    
    <text x="90" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">I(x,y,c) ∈ [0,255]</text>
  </g>
  
  <!-- Arrow to convolution -->
  <path d="M 160 110 L 190 110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Convolutional Layer Section -->
  <g id="convolution">
    <rect x="200" y="60" width="150" height="100" fill="url(#convGradient)" stroke="#f57c00" stroke-width="2" rx="8"/>
    <text x="275" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Convolution</text>
    <text x="275" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">K×K Kernels</text>
    <text x="275" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Feature Maps</text>
    
    <!-- Kernel representation -->
    <g id="kernel" transform="translate(220, 130)">
      <rect width="30" height="20" fill="#ff9800" stroke="#f57c00" stroke-width="1" rx="3"/>
      <text x="15" y="13" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#fff">Kernel</text>
    </g>
    
    <!-- Convolution operation formula -->
    <text x="275" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">(I * K)(x,y) = ΣΣ I(x-i,y-j)K(i,j)</text>
  </g>
  
  <!-- Arrow to pooling -->
  <path d="M 360 110 L 390 110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Pooling Layer Section -->
  <g id="pooling">
    <rect x="400" y="60" width="120" height="100" fill="#ffecb3" stroke="#ffc107" stroke-width="2" rx="8"/>
    <text x="460" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#333">Pooling</text>
    <text x="460" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Max/Average</text>
    <text x="460" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#333">Downsampling</text>
    
    <!-- Pooling grid -->
    <g transform="translate(430, 130)">
      <rect width="15" height="15" fill="#ffc107" stroke="#ff8f00" stroke-width="1"/>
      <rect width="15" height="15" x="15" fill="#ffc107" stroke="#ff8f00" stroke-width="1"/>
      <rect width="15" height="15" y="15" fill="#ffc107" stroke="#ff8f00" stroke-width="1"/>
      <rect width="15" height="15" x="15" y="15" fill="#ffc107" stroke="#ff8f00" stroke-width="1"/>
      <text x="15" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#333">2×2</text>
    </g>
    
    <text x="460" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">max{I(2i,2j), I(2i+1,2j), I(2i,2j+1), I(2i+1,2j+1)}</text>
  </g>
  
  <!-- Arrow to feature extraction -->
  <path d="M 530 110 L 560 110" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  
  <!-- Feature Extraction Section -->
  <g id="feature-extraction">
    <rect x="570" y="60" width="150" height="100" fill="url(#featureGradient)" stroke="#4caf50" stroke-width="2" rx="8"/>
    <text x="645" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Feature Maps</text>
    <text x="645" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Learned Filters</text>
    <text x="645" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#fff">Edge/Texture</text>
    
    <!-- Feature visualization -->
    <g transform="translate(590, 130)">
      <!-- Edge detection pattern -->
      <rect width="20" height="5" fill="#4caf50"/>
      <rect width="5" height="20" x="30" fill="#4caf50"/>
      <circle cx="50" cy="10" r="8" fill="none" stroke="#4caf50" stroke-width="2"/>
      <path d="M 65 2 Q 75 10, 85 18" stroke="#4caf50" stroke-width="2" fill="none"/>
    </g>
    
    <text x="645" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">f_l = σ(W_l * f_{l-1} + b_l)</text>
  </g>
  
  <!-- Object Detection Section -->
  <g id="object-detection">
    <rect x="30" y="200" width="340" height="180" fill="#ffffff" stroke="#9c27b0" stroke-width="2" rx="10"/>
    <text x="200" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9c27b0">Object Detection</text>
    
    <!-- Bounding boxes -->
    <rect x="60" y="240" width="80" height="60" fill="none" stroke="#e91e63" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="100" y="235" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e91e63">Car: 0.95</text>
    <circle cx="100" cy="270" r="25" fill="url(#detectionGradient)"/>
    
    <rect x="180" y="250" width="60" height="40" fill="none" stroke="#4caf50" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="210" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#4caf50">Person: 0.89</text>
    <rect x="190" y="260" width="40" height="20" fill="#4caf50" opacity="0.3"/>
    
    <rect x="280" y="245" width="70" height="50" fill="none" stroke="#ff9800" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="315" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ff9800">Bike: 0.78</text>
    <ellipse cx="315" cy="270" rx="25" ry="15" fill="#ff9800" opacity="0.3"/>
    
    <!-- YOLO/R-CNN Architecture -->
    <text x="60" y="320" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">YOLO Architecture:</text>
    <text x="60" y="335" font-family="Arial, sans-serif" font-size="10" fill="#555">• Grid-based detection: S×S grid cells</text>
    <text x="60" y="350" font-family="Arial, sans-serif" font-size="10" fill="#555">• Bounding box regression: (x,y,w,h)</text>
    <text x="60" y="365" font-family="Arial, sans-serif" font-size="10" fill="#555">• Confidence score: P(object) × IoU</text>
  </g>
  
  <!-- Image Segmentation Section -->
  <g id="segmentation">
    <rect x="410" y="200" width="360" height="180" fill="#ffffff" stroke="#607d8b" stroke-width="2" rx="10"/>
    <text x="590" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#607d8b">Image Segmentation</text>
    
    <!-- U-Net Architecture Diagram -->
    <g id="unet-architecture">
      <!-- Encoder path -->
      <rect x="440" y="250" width="40" height="30" fill="#42a5f5" stroke="#1976d2" stroke-width="1" rx="3"/>
      <text x="460" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Conv</text>
      
      <path d="M 480 265 L 500 275" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <rect x="500" y="260" width="40" height="30" fill="#66bb6a" stroke="#4caf50" stroke-width="1" rx="3"/>
      <text x="520" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Pool</text>
      
      <!-- Bottleneck -->
      <rect x="580" y="265" width="40" height="20" fill="#ff7043" stroke="#ff5722" stroke-width="1" rx="3"/>
      <text x="600" y="278" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Bridge</text>
      
      <!-- Decoder path -->
      <path d="M 620 275 L 640 265" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <rect x="640" y="250" width="40" height="30" fill="#ab47bc" stroke="#9c27b0" stroke-width="1" rx="3"/>
      <text x="660" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Upsamp</text>
      
      <rect x="700" y="250" width="40" height="30" fill="#26a69a" stroke="#009688" stroke-width="1" rx="3"/>
      <text x="720" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Conv</text>
      
      <!-- Skip connections -->
      <path d="M 460 250 Q 490 230, 660 250" stroke="#e91e63" stroke-width="2" stroke-dasharray="3,3" fill="none"/>
      <text x="560" y="240" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#e91e63">Skip Connection</text>
    </g>
    
    <!-- Segmentation output -->
    <g transform="translate(440, 300)">
      <text x="0" y="20" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Pixel-wise Classification:</text>
      <rect x="0" y="25" width="15" height="15" fill="#2196f3" opacity="0.7"/>
      <text x="20" y="37" font-family="Arial, sans-serif" font-size="10" fill="#333">Sky</text>
      <rect x="60" y="25" width="15" height="15" fill="#4caf50" opacity="0.7"/>
      <text x="80" y="37" font-family="Arial, sans-serif" font-size="10" fill="#333">Road</text>
      <rect x="120" y="25" width="15" height="15" fill="#ff9800" opacity="0.7"/>
      <text x="140" y="37" font-family="Arial, sans-serif" font-size="10" fill="#333">Car</text>
      <rect x="180" y="25" width="15" height="15" fill="#e91e63" opacity="0.7"/>
      <text x="200" y="37" font-family="Arial, sans-serif" font-size="10" fill="#333">Person</text>
      
      <text x="0" y="65" font-family="Arial, sans-serif" font-size="10" fill="#555">Loss: L = -Σᵢ Σc yᵢc log(pᵢc)</text>
    </g>
  </g>
  
  <!-- Mathematical Foundations -->
  <g id="math-foundations">
    <rect x="30" y="400" width="740" height="170" fill="#f5f5f5" stroke="#666" stroke-width="1" rx="10"/>
    <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Mathematical Foundations</text>
    
    <!-- Convolution Mathematics -->
    <g id="conv-math">
      <text x="50" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1976d2">Convolution Operation:</text>
      <text x="50" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">(I * K)(m,n) = ΣΣ I(m-i,n-j) × K(i,j)</text>
      <text x="50" y="485" font-family="Arial, sans-serif" font-size="11" fill="#555">Output size: ((H-K+2P)/S + 1) × ((W-K+2P)/S + 1)</text>
      <text x="50" y="500" font-family="Arial, sans-serif" font-size="11" fill="#555">where P=padding, S=stride, K=kernel size</text>
    </g>
    
    <!-- Backpropagation -->
    <g id="backprop-math">
      <text x="400" y="450" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f57c00">Backpropagation:</text>
      <text x="400" y="470" font-family="Arial, sans-serif" font-size="12" fill="#333">∂L/∂K = ∂L/∂O * ∂O/∂K = δ * I</text>
      <text x="400" y="485" font-family="Arial, sans-serif" font-size="11" fill="#555">∂L/∂I = ∂L/∂O * ∂O/∂I = δ * rot180(K)</text>
      <text x="400" y="500" font-family="Arial, sans-serif" font-size="11" fill="#555">where δ is the error gradient</text>
    </g>
    
    <!-- Activation Functions -->
    <g id="activation-math">
      <text x="50" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Activation Functions:</text>
      <text x="50" y="545" font-family="Arial, sans-serif" font-size="12" fill="#333">ReLU: f(x) = max(0,x)</text>
      <text x="200" y="545" font-family="Arial, sans-serif" font-size="12" fill="#333">Sigmoid: σ(x) = 1/(1+e⁻ˣ)</text>
      <text x="350" y="545" font-family="Arial, sans-serif" font-size="12" fill="#333">Tanh: tanh(x) = (eˣ-e⁻ˣ)/(eˣ+e⁻ˣ)</text>
    </g>
    
    <!-- Loss Functions -->
    <g id="loss-math">
      <text x="500" y="525" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e91e63">Loss Functions:</text>
      <text x="500" y="545" font-family="Arial, sans-serif" font-size="12" fill="#333">Cross-entropy: L = -Σᵢ yᵢ log(ŷᵢ)</text>
      <text x="500" y="560" font-family="Arial, sans-serif" font-size="12" fill="#333">IoU Loss: L = 1 - |A∩B|/|A∪B|</text>
    </g>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>