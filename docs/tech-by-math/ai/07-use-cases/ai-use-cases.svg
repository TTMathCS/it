<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="visionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="nlpGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#388e3c;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="recsysGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#f57c00;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="healthGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e91e63;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c2185b;stop-opacity:0.8" />
    </linearGradient>
    <radialGradient id="autonomousGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9c27b0;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#f7f7f7"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">AI Use Cases &amp; Applications</text>
  
  <!-- Computer Vision Section -->
  <g id="computer-vision">
    <rect x="30" y="60" width="360" height="150" fill="#ffffff" stroke="#2196f3" stroke-width="2" rx="10"/>
    <text x="210" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2196f3">Computer Vision</text>
    
    <!-- Image classification example -->
    <g id="image-classification">
      <!-- Input image representation -->
      <rect x="60" y="100" width="60" height="60" fill="#e3f2fd" stroke="#1976d2" stroke-width="2" rx="5"/>
      <text x="90" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1976d2">Image</text>
      <text x="90" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">224×224×3</text>
      <text x="90" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">pixels</text>
      
      <!-- Arrow -->
      <path d="M 130 130 L 150 130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- CNN representation -->
      <rect x="160" y="100" width="80" height="60" fill="url(#visionGradient)" stroke="#1976d2" stroke-width="2" rx="5"/>
      <text x="200" y="120" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">CNN</text>
      <text x="200" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">ConvNet</text>
      <text x="200" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Features</text>
      
      <!-- Arrow -->
      <path d="M 250 130 L 270 130" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- Output classification -->
      <rect x="280" y="100" width="80" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
      <text x="320" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">Prediction</text>
      <text x="320" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Cat: 92.3%</text>
      <text x="320" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Dog: 7.1%</text>
      <text x="320" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Bird: 0.6%</text>
    </g>
    
    <!-- Applications -->
    <text x="50" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Applications:</text>
    <text x="50" y="200" font-family="Arial, sans-serif" font-size="10" fill="#555">• Medical imaging, Face recognition, Autonomous driving, Object detection</text>
  </g>
  
  <!-- Natural Language Processing Section -->
  <g id="nlp">
    <rect x="410" y="60" width="360" height="150" fill="#ffffff" stroke="#4caf50" stroke-width="2" rx="10"/>
    <text x="590" y="85" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#4caf50">Natural Language Processing</text>
    
    <!-- Text processing pipeline -->
    <g id="text-processing">
      <!-- Input text -->
      <rect x="440" y="100" width="80" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
      <text x="480" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">"Hello AI"</text>
      <text x="480" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Raw Text</text>
      
      <!-- Arrow -->
      <path d="M 530 120 L 550 120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- Transformer -->
      <rect x="560" y="100" width="80" height="40" fill="url(#nlpGradient)" stroke="#4caf50" stroke-width="2" rx="5"/>
      <text x="600" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Transformer</text>
      <text x="600" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Self-Attention</text>
      
      <!-- Arrow -->
      <path d="M 650 120 L 670 120" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- Output -->
      <rect x="680" y="100" width="80" height="40" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
      <text x="720" y="115" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f57c00">Embeddings</text>
      <text x="720" y="130" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Vector Rep.</text>
    </g>
    
    <!-- Attention mechanism formula -->
    <text x="440" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Attention: Softmax(QKᵀ/√d_k)V</text>
    
    <!-- Applications -->
    <text x="440" y="185" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Applications:</text>
    <text x="440" y="200" font-family="Arial, sans-serif" font-size="10" fill="#555">• Translation, Chatbots, Sentiment analysis, Text summarization</text>
  </g>
  
  <!-- Recommendation Systems Section -->
  <g id="recommendation-systems">
    <rect x="30" y="230" width="360" height="150" fill="#ffffff" stroke="#ff9800" stroke-width="2" rx="10"/>
    <text x="210" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ff9800">Recommendation Systems</text>
    
    <!-- Matrix factorization visualization -->
    <g id="matrix-factorization">
      <!-- User-Item Matrix -->
      <rect x="60" y="270" width="60" height="60" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
      <text x="90" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f57c00">R</text>
      <text x="90" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">User×Item</text>
      <text x="90" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Ratings</text>
      
      <!-- Equals sign -->
      <text x="135" y="305" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">≈</text>
      
      <!-- User factors -->
      <rect x="155" y="270" width="50" height="60" fill="url(#recsysGradient)" stroke="#f57c00" stroke-width="2" rx="5"/>
      <text x="180" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">U</text>
      <text x="180" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">User</text>
      <text x="180" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Factors</text>
      
      <!-- Multiplication sign -->
      <text x="215" y="305" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#333">×</text>
      
      <!-- Item factors -->
      <rect x="235" y="270" width="50" height="60" fill="url(#recsysGradient)" stroke="#f57c00" stroke-width="2" rx="5"/>
      <text x="260" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Vᵀ</text>
      <text x="260" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Item</text>
      <text x="260" y="320" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Factors</text>
      
      <!-- Recommendation output -->
      <path d="M 295 300 L 315 300" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
      <rect x="320" y="280" width="60" height="40" fill="#e8f5e8" stroke="#4caf50" stroke-width="2" rx="5"/>
      <text x="350" y="295" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#2e7d32">Top-N</text>
      <text x="350" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#333">Items</text>
    </g>
    
    <!-- Loss function -->
    <text x="50" y="350" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#333">Loss: Σ(rᵤᵢ - uᵤᵀvᵢ)² + λ(||uᵤ||² + ||vᵢ||²)</text>
    
    <!-- Applications -->
    <text x="50" y="365" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Applications:</text>
    <text x="50" y="375" font-family="Arial, sans-serif" font-size="10" fill="#555">• E-commerce, Streaming platforms, Social media, News feeds</text>
  </g>
  
  <!-- Healthcare AI Section -->
  <g id="healthcare">
    <rect x="410" y="230" width="360" height="150" fill="#ffffff" stroke="#e91e63" stroke-width="2" rx="10"/>
    <text x="590" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#e91e63">Healthcare AI</text>
    
    <!-- Medical diagnosis pipeline -->
    <g id="medical-diagnosis">
      <!-- Medical image -->
      <rect x="440" y="270" width="60" height="50" fill="#fce4ec" stroke="#e91e63" stroke-width="2" rx="5"/>
      <text x="470" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#c2185b">X-Ray</text>
      <text x="470" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Medical</text>
      <text x="470" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Image</text>
      
      <!-- Arrow -->
      <path d="M 510 295 L 530 295" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- AI Model -->
      <rect x="540" y="270" width="80" height="50" fill="url(#healthGradient)" stroke="#e91e63" stroke-width="2" rx="5"/>
      <text x="580" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff">Deep CNN</text>
      <text x="580" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Medical AI</text>
      <text x="580" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Trained</text>
      
      <!-- Arrow -->
      <path d="M 630 295 L 650 295" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
      
      <!-- Diagnosis -->
      <rect x="660" y="270" width="80" height="50" fill="#fff3e0" stroke="#ff9800" stroke-width="2" rx="5"/>
      <text x="700" y="285" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#f57c00">Diagnosis</text>
      <text x="700" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">93.2% Conf.</text>
      <text x="700" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Pneumonia</text>
    </g>
    
    <!-- Applications -->
    <text x="440" y="345" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Applications:</text>
    <text x="440" y="360" font-family="Arial, sans-serif" font-size="10" fill="#555">• Medical imaging, Drug discovery, Personalized medicine, Clinical decision support</text>
    <text x="440" y="375" font-family="Arial, sans-serif" font-size="10" fill="#555">• Accuracy often exceeds human specialists in specific domains</text>
  </g>
  
  <!-- Autonomous Vehicles Section -->
  <g id="autonomous-vehicles">
    <rect x="30" y="400" width="740" height="170" fill="#ffffff" stroke="#9c27b0" stroke-width="2" rx="10"/>
    <text x="400" y="425" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#9c27b0">Autonomous Vehicles</text>
    
    <!-- Sensor fusion diagram -->
    <g id="sensor-fusion">
      <!-- Vehicle representation -->
      <ellipse cx="400" cy="480" rx="40" ry="20" fill="url(#autonomousGradient)" stroke="#7b1fa2" stroke-width="2"/>
      <text x="400" y="485" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Vehicle</text>
      
      <!-- Sensors around vehicle -->
      <!-- Camera -->
      <rect x="300" y="440" width="40" height="25" fill="#2196f3" stroke="#1976d2" stroke-width="1" rx="3"/>
      <text x="320" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Camera</text>
      <line x1="340" y1="452" x2="370" y2="470" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
      
      <!-- LiDAR -->
      <rect x="460" y="440" width="40" height="25" fill="#4caf50" stroke="#388e3c" stroke-width="1" rx="3"/>
      <text x="480" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">LiDAR</text>
      <line x1="460" y1="452" x2="430" y2="470" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
      
      <!-- Radar -->
      <rect x="300" y="510" width="40" height="25" fill="#ff9800" stroke="#f57c00" stroke-width="1" rx="3"/>
      <text x="320" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Radar</text>
      <line x1="340" y1="522" x2="370" y2="490" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
      
      <!-- GPS -->
      <rect x="460" y="510" width="40" height="25" fill="#e91e63" stroke="#c2185b" stroke-width="1" rx="3"/>
      <text x="480" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">GPS</text>
      <line x1="460" y1="522" x2="430" y2="490" stroke="#666" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    
    <!-- AI Processing Pipeline -->
    <g id="ai-pipeline">
      <!-- Perception -->
      <rect x="550" y="440" width="80" height="30" fill="#e3f2fd" stroke="#1976d2" stroke-width="1" rx="5"/>
      <text x="590" y="455" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1976d2">Perception</text>
      <text x="590" y="465" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Object Detection</text>
      
      <!-- Planning -->
      <rect x="550" y="480" width="80" height="30" fill="#e8f5e8" stroke="#4caf50" stroke-width="1" rx="5"/>
      <text x="590" y="495" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4caf50">Planning</text>
      <text x="590" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Path Planning</text>
      
      <!-- Control -->
      <rect x="550" y="520" width="80" height="30" fill="#fff3e0" stroke="#ff9800" stroke-width="1" rx="5"/>
      <text x="590" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ff9800">Control</text>
      <text x="590" y="545" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#333">Vehicle Control</text>
    </g>
    
    <!-- Mathematical models -->
    <text x="50" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Key Algorithms:</text>
    <text x="50" y="465" font-family="Arial, sans-serif" font-size="10" fill="#555">• SLAM (Simultaneous Localization and Mapping)</text>
    <text x="50" y="480" font-family="Arial, sans-serif" font-size="10" fill="#555">• Kalman Filtering for sensor fusion</text>
    <text x="50" y="495" font-family="Arial, sans-serif" font-size="10" fill="#555">• Reinforcement Learning for decision making</text>
    <text x="50" y="510" font-family="Arial, sans-serif" font-size="10" fill="#555">• Computer Vision for object detection</text>
    
    <!-- Safety metrics -->
    <text x="650" y="450" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#333">Safety Levels:</text>
    <text x="650" y="465" font-family="Arial, sans-serif" font-size="10" fill="#555">• Level 0: No automation</text>
    <text x="650" y="480" font-family="Arial, sans-serif" font-size="10" fill="#555">• Level 2: Partial automation</text>
    <text x="650" y="495" font-family="Arial, sans-serif" font-size="10" fill="#555">• Level 4: High automation</text>
    <text x="650" y="510" font-family="Arial, sans-serif" font-size="10" fill="#555">• Level 5: Full automation</text>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>