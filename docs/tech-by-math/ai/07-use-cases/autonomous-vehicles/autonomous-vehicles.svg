<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="vehicleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f3e5f5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9c27b0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sensorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e3f2fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2196f3;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="perceptionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8f5e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="planningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fff3e0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="controlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffebee;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f44336;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="radarGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ff9800;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ff9800;stop-opacity:0.1" />
    </radialGradient>
    <radialGradient id="lidarGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#4caf50;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#4caf50;stop-opacity:0.1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa"/>
  
  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">Autonomous Vehicles: Mathematical Foundations</text>
  
  <!-- Vehicle Central Unit -->
  <g id="autonomous-vehicle">
    <ellipse cx="400" cy="200" rx="60" ry="40" fill="url(#vehicleGradient)" stroke="#7b1fa2" stroke-width="3"/>
    <text x="400" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Autonomous</text>
    <text x="400" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Vehicle</text>
  </g>
  
  <!-- Sensor Systems -->
  <!-- Camera -->
  <g id="camera-sensor">
    <rect x="280" y="120" width="60" height="35" fill="url(#sensorGradient)" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="310" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Camera</text>
    <text x="310" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">RGB/Stereo</text>
    
    <!-- Camera field of view -->
    <path d="M 310 155 L 290 180 L 330 180 Z" fill="#2196f3" opacity="0.3"/>
    
    <!-- Connection to vehicle -->
    <line x1="340" y1="150" x2="360" y2="180" stroke="#666" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- LiDAR -->
  <g id="lidar-sensor">
    <rect x="460" y="120" width="60" height="35" fill="url(#sensorGradient)" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="490" y="140" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">LiDAR</text>
    <text x="490" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Point Cloud</text>
    
    <!-- LiDAR scanning pattern -->
    <g transform="translate(490, 155)">
      <circle r="25" fill="none" stroke="#4caf50" stroke-width="1" opacity="0.5"/>
      <circle r="35" fill="none" stroke="#4caf50" stroke-width="1" opacity="0.3"/>
      <circle r="45" fill="none" stroke="#4caf50" stroke-width="1" opacity="0.2"/>
      <!-- Scanning rays -->
      <line x1="0" y1="0" x2="0" y2="-45" stroke="#4caf50" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="32" y2="-32" stroke="#4caf50" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="45" y2="0" stroke="#4caf50" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="32" y2="32" stroke="#4caf50" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="-32" y2="32" stroke="#4caf50" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="-45" y2="0" stroke="#4caf50" stroke-width="1" opacity="0.6"/>
      <line x1="0" y1="0" x2="-32" y2="-32" stroke="#4caf50" stroke-width="1" opacity="0.6"/>
    </g>
    
    <!-- Connection to vehicle -->
    <line x1="460" y1="150" x2="440" y2="180" stroke="#666" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Radar -->
  <g id="radar-sensor">
    <rect x="280" y="270" width="60" height="35" fill="url(#sensorGradient)" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="310" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">Radar</text>
    <text x="310" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Doppler</text>
    
    <!-- Radar waves -->
    <g transform="translate(340, 287)">
      <path d="M 0 0 Q 15 -10, 30 0 Q 15 10, 0 0" fill="none" stroke="#ff9800" stroke-width="2" opacity="0.6"/>
      <path d="M 0 0 Q 20 -15, 40 0 Q 20 15, 0 0" fill="none" stroke="#ff9800" stroke-width="2" opacity="0.4"/>
      <path d="M 0 0 Q 25 -20, 50 0 Q 25 20, 0 0" fill="none" stroke="#ff9800" stroke-width="2" opacity="0.3"/>
    </g>
    
    <!-- Connection to vehicle -->
    <line x1="340" y1="280" x2="360" y2="220" stroke="#666" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- GPS/IMU -->
  <g id="gps-imu">
    <rect x="460" y="270" width="60" height="35" fill="url(#sensorGradient)" stroke="#1976d2" stroke-width="2" rx="5"/>
    <text x="490" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#fff">GPS/IMU</text>
    <text x="490" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#fff">Position</text>
    
    <!-- GPS satellites -->
    <g transform="translate(490, 260)">
      <circle cx="-15" cy="-15" r="3" fill="#ffc107"/>
      <circle cx="0" cy="-20" r="3" fill="#ffc107"/>
      <circle cx="15" cy="-15" r="3" fill="#ffc107"/>
      <circle cx="20" cy="0" r="3" fill="#ffc107"/>
      <!-- Signal lines -->
      <line x1="-15" y1="-15" x2="0" y2="10" stroke="#ffc107" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="0" y1="-20" x2="0" y2="10" stroke="#ffc107" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="15" y1="-15" x2="0" y2="10" stroke="#ffc107" stroke-width="1" stroke-dasharray="2,2"/>
      <line x1="20" y1="0" x2="0" y2="10" stroke="#ffc107" stroke-width="1" stroke-dasharray="2,2"/>
    </g>
    
    <!-- Connection to vehicle -->
    <line x1="460" y1="280" x2="440" y2="220" stroke="#666" stroke-width="2" stroke-dasharray="3,3"/>
  </g>
  
  <!-- Processing Pipeline -->
  <!-- Perception Module -->
  <g id="perception-module">
    <rect x="580" y="140" width="100" height="50" fill="url(#perceptionGradient)" stroke="#388e3c" stroke-width="2" rx="8"/>
    <text x="630" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Perception</text>
    <text x="630" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Object Detection</text>
    <text x="630" y="185" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">SLAM</text>
    
    <!-- Arrow from vehicle -->
    <path d="M 460 200 L 570 165" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Planning Module -->
  <g id="planning-module">
    <rect x="580" y="210" width="100" height="50" fill="url(#planningGradient)" stroke="#f57c00" stroke-width="2" rx="8"/>
    <text x="630" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Planning</text>
    <text x="630" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Path Planning</text>
    <text x="630" y="255" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Behavior</text>
    
    <!-- Arrow from perception -->
    <path d="M 630 190 L 630 210" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Control Module -->
  <g id="control-module">
    <rect x="580" y="280" width="100" height="50" fill="url(#controlGradient)" stroke="#d32f2f" stroke-width="2" rx="8"/>
    <text x="630" y="300" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#fff">Control</text>
    <text x="630" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Steering</text>
    <text x="630" y="325" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#fff">Throttle/Brake</text>
    
    <!-- Arrow from planning -->
    <path d="M 630 260 L 630 280" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
    
    <!-- Arrow back to vehicle -->
    <path d="M 580 305 L 460 200" stroke="#333" stroke-width="2" marker-end="url(#arrowhead)"/>
  </g>
  
  <!-- Mathematical Models -->
  <g id="math-models">
    <rect x="30" y="360" width="740" height="210" fill="#ffffff" stroke="#666" stroke-width="2" rx="10"/>
    <text x="400" y="385" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2c3e50">Mathematical Foundations</text>
    
    <!-- Sensor Fusion -->
    <g id="sensor-fusion-math">
      <text x="50" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#2196f3">Sensor Fusion (Kalman Filter):</text>
      <text x="50" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">Prediction: x̂ₖ|ₖ₋₁ = Fₖxₖ₋₁ + Bₖuₖ</text>
      <text x="50" y="445" font-family="Arial, sans-serif" font-size="12" fill="#333">Update: x̂ₖ = x̂ₖ|ₖ₋₁ + Kₖ(zₖ - Hₖx̂ₖ|ₖ₋₁)</text>
      <text x="50" y="460" font-family="Arial, sans-serif" font-size="10" fill="#555">Kalman Gain: Kₖ = Pₖ|ₖ₋₁Hₖᵀ(HₖPₖ|ₖ₋₁Hₖᵀ + Rₖ)⁻¹</text>
    </g>
    
    <!-- Path Planning -->
    <g id="path-planning-math">
      <text x="420" y="410" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ff9800">Path Planning (A* Algorithm):</text>
      <text x="420" y="430" font-family="Arial, sans-serif" font-size="12" fill="#333">f(n) = g(n) + h(n)</text>
      <text x="420" y="445" font-family="Arial, sans-serif" font-size="10" fill="#555">g(n) = actual cost from start to node n</text>
      <text x="420" y="460" font-family="Arial, sans-serif" font-size="10" fill="#555">h(n) = heuristic cost from node n to goal</text>
    </g>
    
    <!-- Vehicle Dynamics -->
    <g id="vehicle-dynamics">
      <text x="50" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4caf50">Vehicle Dynamics (Bicycle Model):</text>
      <text x="50" y="505" font-family="Arial, sans-serif" font-size="12" fill="#333">ẋ = v cos(ψ + β)</text>
      <text x="50" y="520" font-family="Arial, sans-serif" font-size="12" fill="#333">ẏ = v sin(ψ + β)</text>
      <text x="50" y="535" font-family="Arial, sans-serif" font-size="12" fill="#333">ψ̇ = (v/L) tan(δ)</text>
      <text x="50" y="550" font-family="Arial, sans-serif" font-size="10" fill="#555">where β = slip angle, δ = steering angle, L = wheelbase</text>
    </g>
    
    <!-- Control Theory -->
    <g id="control-theory">
      <text x="420" y="485" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#f44336">PID Control:</text>
      <text x="420" y="505" font-family="Arial, sans-serif" font-size="12" fill="#333">u(t) = Kₚe(t) + Kᵢ∫₀ᵗe(τ)dτ + Kₘde(t)/dt</text>
      <text x="420" y="520" font-family="Arial, sans-serif" font-size="10" fill="#555">e(t) = reference - actual (error signal)</text>
      
      <text x="420" y="540" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#f44336">Model Predictive Control (MPC):</text>
      <text x="420" y="555" font-family="Arial, sans-serif" font-size="11" fill="#333">min Σᵢ₌₀ᴺ⁻¹ [||xᵢ - xᵣₑf||²Q + ||uᵢ||²R]</text>
    </g>
  </g>
  
  <!-- Environment Context -->
  <g id="environment">
    <text x="70" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#666">Environment:</text>
    
    <!-- Road -->
    <rect x="50" y="330" width="200" height="15" fill="#666" rx="7"/>
    <line x1="60" y1="337.5" x2="240" y2="337.5" stroke="#fff" stroke-width="2" stroke-dasharray="10,5"/>
    
    <!-- Traffic lights -->
    <rect x="270" y="325" width="8" height="25" fill="#333"/>
    <circle cx="274" cy="330" r="2" fill="#f44336"/>
    <circle cx="274" cy="335" r="2" fill="#ffc107"/>
    <circle cx="274" cy="340" r="2" fill="#4caf50"/>
    
    <!-- Other vehicles -->
    <rect x="180" y="320" width="25" height="15" fill="#9e9e9e" rx="3"/>
    <circle cx="185" cy="337" r="2" fill="#333"/>
    <circle cx="200" cy="337" r="2" fill="#333"/>
    
    <!-- Pedestrian -->
    <circle cx="300" cy="315" r="3" fill="#ff5722"/>
    <rect x="298" y="318" width="4" height="8" fill="#ff5722"/>
    <rect x="299" y="325" width="1" height="5" fill="#ff5722"/>
    <rect x="300" y="325" width="1" height="5" fill="#ff5722"/>
  </g>
  
  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
            refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#333"/>
    </marker>
  </defs>
</svg>