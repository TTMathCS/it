<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520">
  <defs>
    <style>
      .title{font:700 20px Arial, sans-serif;fill:#222}
      .label{font:600 14px Arial, sans-serif;fill:#222}
      .text{font:12px Arial, sans-serif;fill:#333}
      .box{fill:#f6f8fa;stroke:#9aa7b0;stroke-width:1.2}
      .accent{fill:#e6f4ff;stroke:#4a90e2}
      .io{fill:#fffbe6;stroke:#caa300}
      .action{fill:#eef7ee;stroke:#4caf50}
      .arrow{stroke:#6b6f76;stroke-width:1.6;marker-end:url(#m)}
    </style>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6f76" />
    </marker>
  </defs>

  <text x="20" y="30" class="title">AI Agent Overview: Perceive → Reason/Plan → Act → Reflect</text>

  <!-- Inputs -->
  <rect x="20" y="60" width="170" height="110" rx="8" class="io"/>
  <text x="35" y="85" class="label">Perception</text>
  <text x="35" y="105" class="text">• Text, speech, images</text>
  <text x="35" y="122" class="text">• Events, telemetry</text>
  <text x="35" y="139" class="text">• User profile, context</text>

  <!-- Reasoning/Planning -->
  <rect x="220" y="60" width="240" height="180" rx="8" class="accent"/>
  <text x="235" y="85" class="label">Reasoning &amp; Planning</text>
  <text x="235" y="105" class="text">• Goal decomposition</text>
  <text x="235" y="122" class="text">• Tool selection</text>
  <text x="235" y="139" class="text">• Chain/Tree of Thought</text>
  <text x="235" y="156" class="text">• Reflection &amp; critique</text>
  <text x="235" y="173" class="text">• Safety policy checks</text>

  <!-- Memory -->
  <rect x="220" y="260" width="240" height="110" rx="8" class="box"/>
  <text x="235" y="285" class="label">Memory</text>
  <text x="235" y="305" class="text">• Working memory (task)</text>
  <text x="235" y="322" class="text">• Long‑term knowledge</text>
  <text x="235" y="339" class="text">• Episodic experience</text>

  <!-- Tools/Actions -->
  <rect x="500" y="60" width="200" height="180" rx="8" class="action"/>
  <text x="515" y="85" class="label">Tools &amp; Actions</text>
  <text x="515" y="105" class="text">• APIs, DBs, search</text>
  <text x="515" y="122" class="text">• Code exec, sandbox</text>
  <text x="515" y="139" class="text">• Browsers, apps</text>
  <text x="515" y="156" class="text">• Devices/robots</text>

  <!-- Environment/Outputs -->
  <rect x="740" y="60" width="220" height="180" rx="8" class="io"/>
  <text x="755" y="85" class="label">Environment &amp; Outputs</text>
  <text x="755" y="105" class="text">• Responses, artifacts</text>
  <text x="755" y="122" class="text">• State changes</text>
  <text x="755" y="139" class="text">• Tickets, reports</text>
  <text x="755" y="156" class="text">• Side‑effects</text>

  <!-- Governance -->
  <rect x="500" y="260" width="460" height="110" rx="8" class="box"/>
  <text x="515" y="285" class="label">Policies, AuthZ, Observability</text>
  <text x="515" y="305" class="text">• Guardrails, approvals, scopes</text>
  <text x="515" y="322" class="text">• Tracing, cost/latency, audits</text>
  <text x="515" y="339" class="text">• Safety &amp; compliance</text>

  <!-- Arrows -->
  <line x1="190" y1="115" x2="220" y2="115" class="arrow"/>
  <line x1="460" y1="150" x2="500" y2="150" class="arrow"/>
  <line x1="700" y1="150" x2="740" y2="150" class="arrow"/>
  <line x1="850" y1="240" x2="620" y2="260" class="arrow"/>
  <line x1="340" y1="240" x2="340" y2="260" class="arrow"/>
  <line x1="620" y1="240" x2="620" y2="260" class="arrow"/>
</svg>